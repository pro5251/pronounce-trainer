# Every day: read open "new-word" issues opened by the repo owner (the site's 「送到每日更新」 button),
# let Claude Code add full breakdowns to words.json, render audio on Windows, commit, close the issues, deploy.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: Daily new words

on:
  schedule:
    - cron: '0 11 * * *'   # 19:00 Asia/Taipei
  workflow_dispatch:

concurrency:
  group: daily-words
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  words:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.collect.outputs.issues }}
      added: ${{ steps.diff.outputs.added }}
    steps:
      - uses: actions/checkout@v4

      - id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label new-word --state open \
            --author "$GITHUB_REPOSITORY_OWNER" --limit 50 --json number,body > issues.json
          echo "issues=$(jq -c '[.[].number]' issues.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | .body' issues.json | grep '^- ' > new-words.txt || true
          echo "### $(jq length issues.json) issue(s), $(wc -l < new-words.txt) item(s)" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' new-words.txt >> "$GITHUB_STEP_SUMMARY"

      - if: steps.collect.outputs.issues != '[]'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude adds the words
        if: steps.collect.outputs.issues != '[]'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cp public/words.json "$RUNNER_TEMP/words.before.json"
          npm install -g @anthropic-ai/claude-code
          claude -p "$(cat .github/prompts/add-words.md)" \
            --allowedTools "Read,Edit(./public/words.json),Bash(node scripts/validate-words.mjs)" \
            --max-turns 40

      - id: diff
        if: steps.collect.outputs.issues != '[]'
        run: |
          node scripts/validate-words.mjs
          added=$(node scripts/diff-words.mjs "$RUNNER_TEMP/words.before.json" public/words.json)
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo "### Added: $added" >> "$GITHUB_STEP_SUMMARY"
          if [ "$added" = "[]" ]; then echo "::warning::Claude added no words; issues stay open."; fi

      - if: steps.diff.outputs.added != '' && steps.diff.outputs.added != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: words
          path: public/words.json
          retention-days: 3

  audio:
    needs: words
    if: needs.words.outputs.added != '' && needs.words.outputs.added != '[]'
    runs-on: windows-latest   # audio is rendered with the Windows speech engine (Zira)
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: words
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-audio.mjs
      - run: node --test
      - name: Commit
        shell: pwsh
        env:
          ADDED: ${{ needs.words.outputs.added }}
        run: |
          $words = ($env:ADDED | ConvertFrom-Json) -join ', '
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/words.json public/audio
          git commit -m "Add words: $words" -m "Generated by the daily-words workflow from new-word issues."
          git push
      - name: Close issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.words.outputs.issues }}
          ADDED: ${{ needs.words.outputs.added }}
        run: |
          $words = ($env:ADDED | ConvertFrom-Json) -join '、'
          foreach ($n in ($env:ISSUES | ConvertFrom-Json)) {
            gh issue close $n --repo $env:GITHUB_REPOSITORY --comment "已加入詞庫：$words"
          }

  deploy:
    needs: audio
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
